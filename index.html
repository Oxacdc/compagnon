<style>
:root {
  --bg: #12151c; --panel: #1d222e; --panel2: #232a38; --text: #e8e6e1; --dim: #9a9aa4;
  --blue: #5b8def; --gold: #d9b44a; --green: #4fb38a; --red: #e06c6c; --okbg: #1c2a24;
  --radius: 12px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-text-size-adjust: 100%;
}
header {
  position: sticky; top: 0; z-index: 2; background: var(--bg);
  display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid #2a3040;
}
header h1 { font-size: 19px; margin: 0; color: var(--gold); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header button { background: none; border: 0; color: var(--text); font: inherit; font-size: 17px; padding: 6px 4px; cursor: pointer; }
main { max-width: 720px; margin: 0 auto; padding: 12px 16px 48px; }
.dim { color: var(--dim); } .small { font-size: 14px; } .center { text-align: center; }
.tile {
  display: block; width: 100%; text-align: left; background: var(--panel); color: var(--text);
  border: 1px solid color-mix(in srgb, var(--accent, var(--blue)) 45%, transparent);
  border-radius: var(--radius); padding: 12px 14px; margin: 0 0 8px; font: inherit; cursor: pointer;
}
.tile b { display: block; color: var(--accent, var(--blue)); font-size: 18px; }
.tile span { color: var(--dim); font-size: 14px; }
.tile.gold { --accent: var(--gold); }
.row { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid #2a3040;
  color: var(--text); font: inherit; padding: 10px 4px; cursor: pointer; }
.row.done { color: var(--dim); }
h2 { color: var(--gold); font-size: 18px; margin: 18px 0 6px; }
h3 { color: var(--gold); font-size: 18px; margin: 16px 0 4px; }
.lesson-title { font-size: 23px; margin: 4px 0 2px; }
.card { background: var(--panel); border-radius: var(--radius); padding: 14px; margin: 8px 0; }
.card.answer { background: var(--okbg); }
.card .q { font-size: 20px; }
.btn { display: block; width: 100%; min-height: 50px; border: 0; border-radius: var(--radius); color: #fff;
  background: var(--blue); font: inherit; font-size: 18px; padding: 10px 14px; margin: 8px 0; cursor: pointer; }
.btn.green { background: #3a8a69; } .btn.red { background: #b05555; } .btn.plain { background: var(--panel2); }
.btn.gold { background: #a88a35; }
.pair { display: flex; gap: 10px; } .pair .btn { flex: 1; }
.choice { display: block; width: 100%; text-align: left; min-height: 50px; border: 0; border-radius: 10px;
  background: var(--panel); color: var(--text); font: inherit; padding: 12px 14px; margin: 6px 0; cursor: pointer; }
.choice.ok { background: #2f6e55; } .choice.ko { background: #8a3f3f; }
.bar { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; margin: 6px 0; }
.bar i { display: block; height: 100%; background: var(--blue); }
.bar.green i { background: var(--green); }
.counter { font-size: 14px; color: var(--dim); }
ul.lesson { padding-left: 20px; margin: 4px 0 8px; } ul.lesson li { margin: 3px 0; }
strong { color: #fff; }
input[type=search], input[type=password] { width: 100%; font: inherit; font-size: 18px; padding: 12px; border-radius: 10px;
  border: 1px solid #39425a; background: var(--panel); color: var(--text); }
.result { display: block; width: 100%; text-align: left; background: var(--panel); border: 0; border-radius: 10px;
  color: var(--text); font: inherit; padding: 10px; margin: 0 0 6px; cursor: pointer; }
.result b { color: var(--blue); display: block; font-size: 16px; }
.result span { color: var(--dim); font-size: 15px; }
.seg { display: flex; gap: 6px; margin: 4px 0 8px; }
.seg button { flex: 1; background: var(--panel); color: var(--text); border: 1px solid #39425a; border-radius: 8px; padding: 8px; font: inherit; }
.seg button.on { background: var(--blue); border-color: var(--blue); }
.prev { font-size: 14px; color: var(--dim); }
.para { margin: 0 0 8px; }
.linkbtn { background: none; border: 0; color: var(--dim); font: inherit; text-decoration: underline; cursor: pointer; padding: 8px 0; }
</style>
</head>

const KEY_STORE = "compagnon-key";
const $main = document.getElementById("main");
function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function fetchStore(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function b64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function decrypt(rawKey) {
  const key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function deriveKey(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass.normalize("NFC")), "PBKDF2", false, ["deriveBits"]);

  document.getElementById("title").textContent = "Compagnon";
  $main.innerHTML = `<form id="unlock" style="margin-top:24px"><p>Mot de passe :</p>
